<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sidebar desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Navigasi utama" style="width: 240px; height: 100%; min-height: 640px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #EAEFEC; display: flex; flex-direction: column; padding: 20px 14px; gap: 6px; font-family: 'Plus Jakarta Sans', sans-serif; color: #14201B">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px 14px">
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #ECFDF3; display: flex; align-items: center; justify-content: center; overflow: hidden">
      <dc-import name="Hamzi" mood="calm" size="44" still="{{ true }}" hint-size="44px,44px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.3px">Hamzi</span>
      <span style="font-size: 12px; color: #6B7873; font-weight: 600">Plan tracker pribadi</span>
    </div>
  </div>

  <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
    <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d1}}"></path><path d="{{it.d2}}"></path><path d="{{it.d3}}"></path></svg>
      <span style="flex: 1">{{it.label}}</span>
    </a>
  </sc-for>

  <div style="height: 1px; background: #EAEFEC; margin: 10px 6px"></div>

  <button onClick="{{toggleChat}}" aria-pressed="{{chatOpen}}" style="{{chatStyle}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#027A48" aria-hidden="true"><path d="M12 2l1.8 5.6L19.5 9.5 13.8 11.4 12 17l-1.8-5.6L4.5 9.5l5.7-1.9z"></path></svg>
    <span style="flex: 1; text-align: left">Chat Hamzi</span>
    <span style="font-size: 11px; font-weight: 700; color: #6B7873; border: 1px solid #DCE3DF; border-radius: 6px; padding: 1px 6px">C</span>
  </button>
  <a href="#notifikasi" style="height: 44px; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 12px; text-decoration: none; color: #3A4541; font-size: 14px; font-weight: 700">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
    <span style="flex: 1">Notifikasi</span>
    <span style="min-width: 20px; height: 20px; border-radius: 999px; background: #FDB022; color: #14201B; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span>
  </a>
  <a href="#pengaturan" style="height: 44px; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 12px; text-decoration: none; color: #3A4541; font-size: 14px; font-weight: 700">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    <span style="flex: 1">Pengaturan</span>
  </a>

  <div style="margin-top: auto; background: #F4F7F5; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 32px; height: 32px; border-radius: 10px; background: #FEECEB; color: #D92D20; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22c4 0 7-2.7 7-7 0-3.5-2.4-6-4-8-.3 2-1.3 3.4-2.6 4C12.5 7.6 11 4.5 8.5 2.5 8.5 6 5 9 5 15c0 4.3 3 7 7 7z"></path></svg></span>
      <div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 800">Streak 4 hari</span><span style="font-size: 11.5px; color: #6B7873; font-weight: 600">Lv 3 · 620/1000 XP</span></div>
    </div>
    <div style="height: 6px; border-radius: 999px; background: #EAEFEC; overflow: hidden"><div style="width: 62%; height: 100%; background: #06AED4; border-radius: 999px"></div></div>
    <span style="font-size: 11px; color: #6B7873; line-height: 1.5">Pintasan: <b>N</b> tugas · <b>E</b> pengeluaran · <b>T</b> timer · <b>/</b> cari</span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["beranda","rencana","kuliah","keuangan","tumbuh"],"default":"beranda"},"chatOpen":{"editor":"boolean","default":false,"tsType":"boolean"},"onToggleChat":{"editor":null},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'beranda';
    const chatOpen = this.props.chatOpen === true || this.props.chatOpen === 'true';
    const defs = [
      ['beranda', 'Beranda', 'Desktop-Beranda.dc.html', 'M3.5 10.5L12 3.5l8.5 7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z', '', ''],
      ['rencana', 'Rencana', 'Desktop-Rencana.dc.html', 'M8 4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z', 'M8.5 12l2.5 2.5 4.5-5', ''],
      ['kuliah', 'Kuliah', 'Desktop-Kuliah.dc.html', 'M2 9.5L12 4.5l10 5-10 5z', 'M6 11.5v4.5c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.5', ''],
      ['keuangan', 'Keuangan', 'Desktop-Keuangan.dc.html', 'M19 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H5', 'M16.5 14h.01', ''],
      ['tumbuh', 'Tumbuh', 'Desktop-Tumbuh.dc.html', 'M12 21v-9', 'M12 12c0-4 3-7 8-7 0 5-3 8-8 7z', 'M12 14c0-3-2.5-5.5-7-5.5 0 4 2.5 6 7 5.5z']
    ];
    return {
      items: defs.map(([id, label, href, d1, d2, d3]) => {
        const on = id === active;
        return {
          label: label, href: href, d1: d1, d2: d2 || 'M0 0', d3: d3 || 'M0 0', current: on ? 'page' : 'false',
          style: 'height: 44px; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 12px; text-decoration: none; font-size: 14px; ' + (on ? 'background: #ECFDF3; color: #027A48; font-weight: 800' : 'background: transparent; color: #3A4541; font-weight: 700')
        };
      }),
      chatOpen: chatOpen,
      toggleChat: () => { if (typeof this.props.onToggleChat === 'function') this.props.onToggleChat(); },
      chatStyle: 'height: 44px; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700; ' + (chatOpen ? 'background: #ECFDF3; color: #027A48' : 'background: transparent; color: #3A4541')
    };
  }
}
</script>
</body>
</html>
