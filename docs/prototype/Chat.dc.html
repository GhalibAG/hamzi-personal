<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Hamzi — Chat asisten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#027A48}a:hover{color:#05603A}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F7F5; font-family: 'Plus Jakarta Sans', sans-serif; color: #14201B; display: flex; flex-direction: column">

  <div style="background: #FFFFFF; border-bottom: 1px solid #EAEFEC; padding: 10px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0">
    <a href="Main.dc.html" aria-label="Kembali ke Beranda" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #3A4541"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #ECFDF3; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0">
      <dc-import name="Hamzi" mood="{{mood}}" size="44" hint-size="44px,44px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
      <span style="font-size: 16px; font-weight: 800">Hamzi</span>
      <span style="font-size: 12px; color: #039855; font-weight: 600">{{status}}</span>
    </div>
    <button aria-label="Riwayat AI dan izin data" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #3A4541; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg></button>
  </div>

  <div ref="{{scrollRef}}" style="flex: 1; overflow-y: auto; padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="flex-shrink: 0; align-self: center; display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #EAEFEC; border-radius: 999px; padding: 6px 12px; font-size: 11.5px; color: #4F5B56; font-weight: 600">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      Hamzi cuma lihat data yang kamu izinkan · aksi selalu minta konfirmasi
    </div>

    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <sc-if value="{{m.isUserText}}" hint-placeholder-val="{{ false }}">
        <div style="flex-shrink: 0; align-self: flex-end; max-width: 80%; background: #027A48; color: #FFFFFF; border-radius: 20px 20px 6px 20px; padding: 10px 14px; font-size: 14px; line-height: 1.5; white-space: pre-line">{{m.text}}</div>
      </sc-if>
      <sc-if value="{{m.isFile}}" hint-placeholder-val="{{ false }}">
        <div style="flex-shrink: 0; align-self: flex-end; width: 250px; background: #FFFFFF; border: 1px solid #A6F4C5; border-radius: 20px 20px 6px 20px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
          <span style="width: 40px; height: 44px; border-radius: 10px; background: #FEE4E2; color: #B42318; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; flex-shrink: 0">{{m.ext}}</span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.name}}</span><span style="font-size: 11.5px; color: #6B7873">{{m.size}}</span></div>
        </div>
      </sc-if>
      <sc-if value="{{m.isBotText}}" hint-placeholder-val="{{ false }}">
        <div style="flex-shrink: 0; align-self: flex-start; max-width: 86%; background: #FFFFFF; border: 1px solid #EAEFEC; border-radius: 20px 20px 20px 6px; padding: 10px 14px; font-size: 14px; line-height: 1.55; white-space: pre-line">{{m.text}}</div>
      </sc-if>
      <sc-if value="{{m.isTyping}}" hint-placeholder-val="{{ false }}">
        <div aria-label="Hamzi sedang mengetik" style="flex-shrink: 0; align-self: flex-start; background: #FFFFFF; border: 1px solid #EAEFEC; border-radius: 20px 20px 20px 6px; padding: 12px 16px; display: flex; gap: 5px">
          <span style="width: 7px; height: 7px; border-radius: 50%; background: #6CE9A6"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: #32D583"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: #12B76A"></span>
        </div>
      </sc-if>
      <sc-if value="{{m.isActions}}" hint-placeholder-val="{{ false }}">
        <div style="flex-shrink: 0; align-self: flex-start; width: 92%; background: #FFFFFF; border: 1px solid #A6F4C5; border-radius: 20px; overflow: hidden">
          <div style="background: #ECFDF3; padding: 10px 14px; display: flex; align-items: center; gap: 8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#027A48" aria-hidden="true"><path d="M12 2l1.8 5.6L19.5 9.5 13.8 11.4 12 17l-1.8-5.6L4.5 9.5l5.7-1.9z"></path></svg>
            <span style="font-size: 13px; font-weight: 800; color: #05603A">{{m.title}}</span>
          </div>
          <div style="padding: 4px 6px">
            <sc-for list="{{m.items}}" as="it" hint-placeholder-count="3">
              <button onClick="{{it.toggle}}" aria-pressed="{{it.on}}" disabled="{{m.locked}}" style="width: 100%; border: 0; background: transparent; display: flex; align-items: center; gap: 10px; padding: 8px; text-align: left; cursor: pointer; border-radius: 12px">
                <span style="{{it.box}}">
                  <sc-if value="{{it.on}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
                </span>
                <span style="{{it.tag}}">{{it.kind}}</span>
                <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1"><span style="font-size: 13.5px; font-weight: 700; color: #14201B">{{it.title}}</span><span style="font-size: 12px; color: #6B7873">{{it.detail}}</span></span>
              </button>
            </sc-for>
          </div>
          <sc-if value="{{m.pending}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; gap: 8px; padding: 6px 12px 12px">
              <button onClick="{{m.apply}}" style="flex: 1; height: 44px; border-radius: 999px; border: 0; background: #027A48; color: #FFFFFF; font-size: 13.5px; font-weight: 800; cursor: pointer">{{m.applyLabel}}</button>
              <button onClick="{{m.cancel}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #DCE3DF; background: #FFFFFF; color: #3A4541; font-size: 13.5px; font-weight: 700; cursor: pointer">Batal</button>
            </div>
          </sc-if>
          <sc-if value="{{m.resolved}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 8px 14px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <span style="font-size: 12.5px; font-weight: 700; color: {{m.resolvedColor}}">{{m.resolvedText}}</span>
              <sc-if value="{{m.canUndo}}" hint-placeholder-val="{{ false }}">
                <button onClick="{{m.undo}}" style="border: 0; background: transparent; color: #027A48; font-size: 12.5px; font-weight: 800; cursor: pointer; height: 36px">Urungkan</button>
              </sc-if>
            </div>
          </sc-if>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #EAEFEC; padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
    <div style="display: flex; gap: 6px; overflow-x: auto">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.send}}" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #A6F4C5; background: #ECFDF3; color: #05603A; font-size: 12.5px; font-weight: 700; white-space: nowrap; cursor: pointer; flex-shrink: 0">{{c.label}}</button>
      </sc-for>
    </div>
    <sc-if value="{{hasAttach}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 8px; background: #F4F7F5; border-radius: 12px; padding: 6px 8px 6px 10px">
        <span style="font-size: 10px; font-weight: 800; color: #B42318; background: #FEE4E2; border-radius: 6px; padding: 3px 5px">PDF</span>
        <span style="font-size: 12.5px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Kontrak Kuliah IMK.pdf · 4 hlm</span>
        <button aria-label="Hapus lampiran" onClick="{{removeAttach}}" style="width: 32px; height: 32px; border: 0; background: transparent; color: #4F5B56; cursor: pointer; font-size: 16px">×</button>
      </div>
    </sc-if>
    <div style="display: flex; align-items: center; gap: 8px">
      <button aria-label="Lampirkan file dosen (PDF atau foto)" onClick="{{attach}}" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #F4F7F5; color: #3A4541; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"></path></svg></button>
      <label style="flex: 1; display: flex">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Pesan untuk Hamzi</span>
        <input value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" placeholder="Ketik perintah atau pertanyaan…" style="flex: 1; height: 44px; border-radius: 999px; border: 1px solid #DCE3DF; padding: 0 16px; font-size: 14px; color: #14201B; background: #FAFBFA; outline-color: #32D583; min-width: 0"></input>
      </label>
      <button aria-label="Kirim" onClick="{{send}}" style="{{sendStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this._id = 100;
    this.state = {
      draft: '', attach: false, typing: false,
      msgs: [
        { id: 1, k: 'file', name: 'RPS Basis Data Lanjut.pdf', size: 'PDF · 6 halaman', ext: 'PDF' },
        { id: 2, k: 'utext', text: 'ini RPS dari dosen, rangkum dong terus masukin yang penting' },
        { id: 3, k: 'btext', text: 'Ringkasnya:\n• Bobot: UTS 30%, UAS 35%, tugas 25%, kehadiran 10%\n• Minimal hadir 75% buat ikut UAS\n• 14 pertemuan, UTS di minggu ke-8\n\nAku nemu 4 hal yang bisa langsung masuk ke app. Centang yang mau ditambah:' },
        { id: 4, k: 'actions', title: 'Usulan dari RPS (4)', state: 'pending', items: [
          { kind: 'Tugas', title: 'Laporan praktikum 5', detail: 'Selasa 20 Okt · Kuliah · Basis Data Lanjut', on: true },
          { kind: 'Tugas', title: 'Rancangan ERD kelompok', detail: 'Selasa 27 Okt · bobot 10%', on: true },
          { kind: 'Ujian', title: 'UTS Basis Data Lanjut', detail: 'Senin 2 Nov · 08:00 · pengingat H-3', on: true },
          { kind: 'Modul', title: 'Basis Data Lanjut', detail: 'Belajar mandiri · 14 unit (per pertemuan)', on: false }
        ] }
      ]
    };
  }
  componentDidUpdate() { if (this._sc) this._sc.scrollTop = this._sc.scrollHeight; }
  componentWillUnmount() { clearTimeout(this._t); }
  nid() { this._id += 1; return this._id; }
  pad(n) { return String(n).padStart(2, '0'); }
  parse(raw) {
    const t = raw.toLowerCase();
    let time = null;
    const tm = t.match(/(?:jam|pukul)\s*(\d{1,2})(?:[.:](\d{2}))?\s*(pagi|siang|sore|malam)?/) || t.match(/\b(\d{1,2})[.:](\d{2})\b/);
    if (tm) {
      let h = parseInt(tm[1], 10); const mi = tm[2] || '00'; const p = tm[3];
      if ((p === 'sore' || p === 'malam') && h < 12) h += 12;
      if (p === 'siang' && h < 11) h += 12;
      time = this.pad(Math.min(h, 23)) + ':' + mi;
    }
    const spend = /(jajan|beli|bayar|habis|keluar|makan|ngopi|bensin|ojek|parkir)/.test(t);
    const am = t.match(/(\d+(?:[.,]\d+)?)\s*(rb|ribu|k|jt|juta)?\b/);
    const clean = (s, words) => {
      let x = s;
      words.forEach((w) => { x = x.replace(new RegExp('\\b' + w + '\\b', 'gi'), ' '); });
      x = x.replace(/(?:jam|pukul)\s*\d{1,2}(?:[.:]\d{2})?/gi, ' ').replace(/\b\d{1,2}[.:]\d{2}\b/g, ' ').replace(/\s+/g, ' ').trim();
      return x ? x.charAt(0).toUpperCase() + x.slice(1) : '';
    };
    if (/rutinitas|tiap hari|setiap hari|tiap pagi|tiap malam|setiap/.test(t)) {
      const name = clean(raw, ['tolong', 'tambahin', 'tambahkan', 'tambah', 'bikin', 'buatin', 'buat', 'rutinitas', 'baru', 'dong', 'ya', 'yang', 'wajib', 'setiap hari', 'tiap hari', 'setiap', 'tiap', 'pagi', 'siang', 'sore', 'malam', 'hari']) || 'Rutinitas baru';
      const rep = /sen.?jum|weekday|hari kerja/.test(t) ? 'Sen–Jum' : 'Setiap hari';
      return { reply: 'Siap. Ini rutinitas yang aku tangkap, cek dulu ya:', title: 'Rutinitas wajib baru', items: [{ kind: 'Rutinitas', title: name, detail: rep + ' · pengingat ' + (time || '07:00') + (time ? '' : ' (default, bisa diubah)'), on: true }], dest: 'Tumbuh' };
    }
    if (spend && am) {
      let n = parseFloat(am[1].replace(',', '.'));
      const u = am[2];
      if (u === 'rb' || u === 'ribu' || u === 'k') n *= 1000;
      else if (u === 'jt' || u === 'juta') n *= 1000000;
      else if (n < 1000) n *= 1000;
      n = Math.round(n);
      const cat = /(makan|nasi|kopi|ngopi|bakso|mie|jajan|minum)/.test(t) ? 'Makan' : /(ojek|bensin|parkir|angkot|bus)/.test(t) ? 'Transport' : /(kuota|pulsa)/.test(t) ? 'Kuota' : 'Lainnya';
      return { reply: 'Oke, aku catat sebagai pengeluaran hari ini:', title: 'Catat pengeluaran', items: [{ kind: 'Keluar', title: 'Rp ' + n.toLocaleString('id-ID') + ' · ' + cat, detail: 'Dompet Tunai · hari ini ' + (time || '16:35'), on: true }], dest: 'Keuangan' };
    }
    if (/tugas|deadline|kumpul|tenggat/.test(t)) {
      const when = /besok/.test(t) ? 'Selasa 13 Okt' : /lusa/.test(t) ? 'Rabu 14 Okt' : 'Tanpa tenggat';
      const name = clean(raw, ['tolong', 'tambahin', 'tambahkan', 'tambah', 'ada', 'tugas', 'deadline', 'dikumpul', 'kumpul', 'tenggat', 'besok', 'lusa', 'dong', 'ya']) || 'Tugas baru';
      return { reply: 'Aku masukin ke Rencana ya:', title: 'Tugas baru', items: [{ kind: 'Tugas', title: name, detail: when + (time ? ' · ' + time : '') + ' · prioritas sedang', on: true }], dest: 'Rencana' };
    }
    if (/rangkum|ringkas|minggu ini|rekap/.test(t)) {
      return { text: 'Minggu ini sejauh ini:\n• Tugas: 7 selesai, 1 terlambat (proposal PKM)\n• Belajar: 140 dari 300 menit, streak 4 hari\n• Keuangan: anggaran terpakai 58%, makan paling besar (46%)\n• Kuliah: hadir 94%, Manajemen Proyek SI mepet batas 75%\n\nSaran: prioritaskan revisi PKM malam ini, lalu jangan bolos MPSI lagi ya.' };
    }
    if (/boros|hemat|pengeluaran/.test(t)) {
      return { text: 'Paling boros di Makan: 46% dari pengeluaran bulan ini, naik 37% dibanding rata-rata 7 hari. Yang paling sering: jajan sore di atas Rp 20.000.\n\nSaran: bawa bekal 2× seminggu, kira-kira hemat Rp 40.000/minggu. Mau aku bikinin rutinitas "Siapin bekal" tiap Senin & Kamis?' };
    }
    return { text: 'Aku bisa bantu: rangkum file dosen, nambah tugas/rutinitas/modul/pengeluaran lewat chat, atau kasih saran dari datamu. Coba misalnya: "tambahin rutinitas minum air 8 gelas jam 9 pagi".' };
  }
  push(list) { this.setState((p) => ({ msgs: p.msgs.concat(list) })); }
  submit(text) {
    const s = this.state;
    const raw = (text || '').trim();
    if (!raw && !s.attach) return;
    const out = [];
    if (s.attach) out.push({ id: this.nid(), k: 'file', name: 'Kontrak Kuliah IMK.pdf', size: 'PDF · 4 halaman', ext: 'PDF' });
    if (raw) out.push({ id: this.nid(), k: 'utext', text: raw });
    const wasFile = s.attach;
    this.setState((p) => ({ msgs: p.msgs.concat(out), draft: '', attach: false, typing: true }));
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      let res;
      if (wasFile) {
        res = { reply: 'Udah aku baca kontrak kuliahnya. Ada 2 tenggat dan 1 kuis yang belum ada di app:', title: 'Usulan dari Kontrak Kuliah IMK (3)', items: [
          { kind: 'Tugas', title: 'Mockup SI akademik (kelompok)', detail: 'Senin 19 Okt · bobot 15%', on: true },
          { kind: 'Ujian', title: 'Kuis IMK: heuristik Nielsen', detail: 'Kamis 22 Okt · 10:00', on: true },
          { kind: 'Tugas', title: 'Usability test 5 responden', detail: 'Senin 16 Nov · bobot 20%', on: true }
        ], dest: 'Rencana & Kuliah' };
      } else res = this.parse(raw);
      const add = [];
      if (res.text) add.push({ id: this.nid(), k: 'btext', text: res.text });
      else {
        add.push({ id: this.nid(), k: 'btext', text: res.reply });
        add.push({ id: this.nid(), k: 'actions', title: res.title, items: res.items, state: 'pending', dest: res.dest });
      }
      this.setState((p) => ({ typing: false, msgs: p.msgs.concat(add) }));
    }, 900);
  }
  setMsg(id, patch) { this.setState((p) => ({ msgs: p.msgs.map((m) => m.id === id ? Object.assign({}, m, typeof patch === 'function' ? patch(m) : patch) : m) })); }
  renderVals() {
    const s = this.state;
    const kindColor = { Tugas: ['#EAF4FF', '#175CD3'], Ujian: ['#FEF0C7', '#93370D'], Modul: ['#E6F7FB', '#0E7090'], Rutinitas: ['#ECFDF3', '#05603A'], Keluar: ['#FEE4E2', '#B42318'] };
    const msgs = s.msgs.map((m) => {
      const base = { isUserText: m.k === 'utext', isFile: m.k === 'file', isBotText: m.k === 'btext', isActions: m.k === 'actions', isTyping: false, text: m.text, name: m.name, size: m.size, ext: m.ext };
      if (m.k !== 'actions') return base;
      const nOn = m.items.filter((i) => i.on).length;
      const locked = m.state !== 'pending';
      return Object.assign(base, {
        title: m.title, locked: locked,
        items: m.items.map((it, idx) => {
          const c = kindColor[it.kind] || kindColor.Tugas;
          return {
            kind: it.kind, title: it.title, detail: it.detail, on: it.on,
            toggle: () => { if (!locked) this.setMsg(m.id, (mm) => ({ items: mm.items.map((x, j) => j === idx ? Object.assign({}, x, { on: !x.on }) : x) })); },
            box: 'width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' + (it.on ? 'background: #12B76A' : 'border: 2px solid #C3CDC8; background: #FFFFFF'),
            tag: 'font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: 999px; flex-shrink: 0; background: ' + c[0] + '; color: ' + c[1]
          };
        }),
        pending: m.state === 'pending',
        resolved: m.state !== 'pending',
        applyLabel: nOn > 0 ? (m.items.length === 1 ? 'Simpan' : 'Tambahkan ' + nOn + ' terpilih') : 'Pilih minimal 1',
        apply: () => { if (nOn > 0) this.setMsg(m.id, { state: 'done', count: nOn }); },
        cancel: () => this.setMsg(m.id, { state: 'cancel' }),
        undo: () => this.setMsg(m.id, { state: 'pending' }),
        canUndo: m.state === 'done',
        resolvedText: m.state === 'done' ? '✓ ' + m.count + ' item ditambahkan ke ' + (m.dest || 'Rencana, Kuliah & Tumbuh') : 'Dibatalkan, tidak ada yang diubah',
        resolvedColor: m.state === 'done' ? '#05603A' : '#6B7873'
      });
    });
    if (s.typing) msgs.push({ isTyping: true, isUserText: false, isFile: false, isBotText: false, isActions: false });
    const canSend = s.draft.trim().length > 0 || s.attach;
    const chipDefs = ['Rangkum minggu ini', 'tambahin rutinitas minum air 8 gelas jam 9 pagi', 'jajan bakso 15rb', 'Aku boros di mana?', 'ada tugas resume jurnal besok jam 20.00'];
    const chipLabels = ['Rangkum minggu ini', '+ Rutinitas minum air', 'Catat: bakso 15rb', 'Aku boros di mana?', '+ Tugas besok'];
    return {
      msgs: msgs,
      mood: s.typing ? 'focus' : 'calm',
      status: s.typing ? 'sedang membaca & mikir…' : 'Asisten · bisa baca file & nambah data',
      scrollRef: (el) => { this._sc = el; },
      draft: s.draft,
      onDraft: (e) => this.setState({ draft: e.target.value.slice(0, 500) }),
      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.submit(s.draft); } },
      send: () => this.submit(s.draft),
      sendStyle: 'width: 44px; height: 44px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; ' + (canSend ? 'background: #027A48; color: #FFFFFF' : 'background: #DCE3DF; color: #6B7873'),
      hasAttach: s.attach,
      attach: () => this.setState({ attach: true }),
      removeAttach: () => this.setState({ attach: false }),
      chips: chipDefs.map((txt, i) => ({ label: chipLabels[i], send: () => this.submit(txt) }))
    };
  }
}
</script>
</body>
</html>
