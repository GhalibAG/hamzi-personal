<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Panel Chat Hamzi (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<aside aria-label="Chat Hamzi" style="width: 380px; height: 100%; min-height: 640px; box-sizing: border-box; background: #F4F7F5; border-left: 1px solid #EAEFEC; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', sans-serif; color: #14201B">
  <div style="background: #FFFFFF; border-bottom: 1px solid #EAEFEC; padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0">
    <div style="width: 40px; height: 40px; border-radius: 50%; background: #ECFDF3; display: flex; align-items: center; justify-content: center; overflow: hidden">
      <dc-import name="Hamzi" mood="{{mood}}" size="40" hint-size="40px,40px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
      <span style="font-size: 15px; font-weight: 800">Chat Hamzi</span>
      <span style="font-size: 12px; color: #039855; font-weight: 600">{{status}}</span>
    </div>
    <button aria-label="Riwayat AI dan izin data" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: transparent; color: #3A4541; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg></button>
    <button aria-label="Tutup panel chat" onClick="{{close}}" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: transparent; color: #3A4541; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>

  <div ref="{{scrollRef}}" style="flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
      <sc-if value="{{m.isUser}}" hint-placeholder-val="{{ false }}">
        <div style="flex-shrink: 0; align-self: flex-end; max-width: 84%; background: #027A48; color: #FFFFFF; border-radius: 18px 18px 6px 18px; padding: 9px 13px; font-size: 13.5px; line-height: 1.5">{{m.text}}</div>
      </sc-if>
      <sc-if value="{{m.isBot}}" hint-placeholder-val="{{ false }}">
        <div style="flex-shrink: 0; align-self: flex-start; max-width: 90%; background: #FFFFFF; border: 1px solid #EAEFEC; border-radius: 18px 18px 18px 6px; padding: 9px 13px; font-size: 13.5px; line-height: 1.55; white-space: pre-line">{{m.text}}</div>
      </sc-if>
      <sc-if value="{{m.isCard}}" hint-placeholder-val="{{ false }}">
        <div style="flex-shrink: 0; background: #FFFFFF; border: 1px solid #A6F4C5; border-radius: 18px; overflow: hidden">
          <div style="background: #ECFDF3; padding: 9px 12px; font-size: 12.5px; font-weight: 800; color: #05603A">{{m.title}}</div>
          <sc-for list="{{m.items}}" as="it" hint-placeholder-count="2">
            <button onClick="{{it.toggle}}" aria-pressed="{{it.on}}" style="width: 100%; border: 0; background: transparent; display: flex; align-items: center; gap: 9px; padding: 8px 12px; text-align: left; cursor: pointer; font-family: inherit">
              <span style="{{it.box}}"><sc-if value="{{it.on}}" hint-placeholder-val="{{ true }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
              <span style="{{it.tag}}">{{it.kind}}</span>
              <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 13px; font-weight: 700; color: #14201B">{{it.title}}</span><span style="font-size: 11.5px; color: #6B7873">{{it.detail}}</span></span>
            </button>
          </sc-for>
          <sc-if value="{{m.pending}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; gap: 8px; padding: 4px 12px 12px">
              <button onClick="{{m.apply}}" style="flex: 1; height: 40px; border-radius: 999px; border: 0; background: #027A48; color: #FFFFFF; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit">{{m.applyLabel}}</button>
              <button onClick="{{m.cancel}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #DCE3DF; background: #FFFFFF; color: #3A4541; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit">Batal</button>
            </div>
          </sc-if>
          <sc-if value="{{m.resolved}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 6px 12px 12px; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; font-weight: 700; color: #05603A">{{m.resolvedText}}</span><button onClick="{{m.undo}}" style="border: 0; background: transparent; color: #027A48; font-size: 12px; font-weight: 800; cursor: pointer; height: 32px; font-family: inherit">Urungkan</button></div>
          </sc-if>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #EAEFEC; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <button onClick="{{chip1}}" style="height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid #A6F4C5; background: #ECFDF3; color: #05603A; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit">+ Rutinitas</button>
      <button onClick="{{chip2}}" style="height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid #A6F4C5; background: #ECFDF3; color: #05603A; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit">Aku boros di mana?</button>
    </div>
    <div style="display: flex; gap: 8px; align-items: center">
      <button aria-label="Lampirkan file (atau seret file ke panel ini)" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #F4F7F5; color: #3A4541; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"></path></svg></button>
      <label style="flex: 1; display: flex; min-width: 0">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Pesan untuk Hamzi</span>
        <input value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" placeholder="Ketik perintah… (Enter kirim)" style="flex: 1; min-width: 0; height: 40px; border-radius: 999px; border: 1px solid #DCE3DF; padding: 0 14px; font-size: 13.5px; font-family: inherit; color: #14201B; background: #FAFBFA"></input>
      </label>
      <button aria-label="Kirim" onClick="{{send}}" style="{{sendStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":380,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this._id = 10;
    this.state = {
      draft: '', typing: false,
      msgs: [
        { id: 1, k: 'user', text: 'rangkum minggu ini' },
        { id: 2, k: 'bot', text: 'Minggu ini sejauh ini:\n• Tugas: 7 selesai, 1 terlambat\n• Belajar: 140 dari 300 menit\n• Anggaran terpakai 58%, Makan paling besar\n\nMau aku bantu atur dua hal ini?' },
        { id: 3, k: 'card', title: 'Usulan (2)', state: 'pending', items: [
          { kind: 'Tugas', title: 'Cicil revisi proposal PKM', detail: 'Hari ini 20:00 · Proyek', on: true },
          { kind: 'Rutinitas', title: 'Siapin bekal', detail: 'Sen & Kam · pengingat 06:30', on: true }
        ] }
      ]
    };
  }
  componentDidUpdate() { if (this._sc) this._sc.scrollTop = this._sc.scrollHeight; }
  componentWillUnmount() { clearTimeout(this._t); }
  setMsg(id, patch) { this.setState((p) => ({ msgs: p.msgs.map((m) => m.id === id ? Object.assign({}, m, typeof patch === 'function' ? patch(m) : patch) : m) })); }
  submit(text) {
    const t = (text || '').trim(); if (!t) return;
    this._id += 1; const uid = this._id;
    this.setState((p) => ({ draft: '', typing: true, msgs: p.msgs.concat([{ id: uid, k: 'user', text: t }]) }));
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      this._id += 2;
      const low = t.toLowerCase();
      const add = /rutinitas/.test(low)
        ? [{ id: this._id - 1, k: 'bot', text: 'Siap, cek dulu ya:' }, { id: this._id, k: 'card', title: 'Rutinitas wajib baru', state: 'pending', items: [{ kind: 'Rutinitas', title: 'Minum air 8 gelas', detail: 'Setiap hari · pengingat 09:00', on: true }] }]
        : [{ id: this._id, k: 'bot', text: /boros/.test(low) ? 'Paling besar di Makan (46% bulan ini). Coba bawa bekal 2× seminggu.' : 'Aku bisa rangkum file dosen, nambah tugas/rutinitas/modul/pengeluaran, atau kasih saran dari datamu.' }];
      this.setState((p) => ({ typing: false, msgs: p.msgs.concat(add) }));
    }, 700);
  }
  renderVals() {
    const s = this.state;
    const tagC = { Tugas: ['#EAF4FF', '#175CD3'], Rutinitas: ['#ECFDF3', '#05603A'] };
    const msgs = s.msgs.map((m) => {
      const b = { isUser: m.k === 'user', isBot: m.k === 'bot', isCard: m.k === 'card', text: m.text };
      if (m.k !== 'card') return b;
      const n = m.items.filter((i) => i.on).length;
      return Object.assign(b, {
        title: m.title,
        items: m.items.map((it, j) => {
          const c = tagC[it.kind] || tagC.Tugas;
          return { kind: it.kind, title: it.title, detail: it.detail, on: it.on,
            toggle: () => { if (m.state === 'pending') this.setMsg(m.id, (mm) => ({ items: mm.items.map((x, q) => q === j ? Object.assign({}, x, { on: !x.on }) : x) })); },
            box: 'width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' + (it.on ? 'background: #12B76A' : 'border: 2px solid #C3CDC8; background: #FFFFFF'),
            tag: 'font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: 999px; flex-shrink: 0; background: ' + c[0] + '; color: ' + c[1] };
        }),
        pending: m.state === 'pending', resolved: m.state === 'done',
        applyLabel: n > 1 ? 'Tambahkan ' + n + ' terpilih' : (n === 1 ? 'Simpan' : 'Pilih minimal 1'),
        apply: () => { if (n > 0) this.setMsg(m.id, { state: 'done', count: n }); },
        cancel: () => this.setMsg(m.id, { state: 'cancel' }),
        undo: () => this.setMsg(m.id, { state: 'pending' }),
        resolvedText: '✓ ' + (m.count || 0) + ' item ditambahkan'
      });
    });
    if (s.typing) msgs.push({ isBot: true, isUser: false, isCard: false, text: '…' });
    const can = s.draft.trim().length > 0;
    return {
      msgs: msgs,
      mood: s.typing ? 'focus' : 'calm',
      status: s.typing ? 'sedang mikir…' : 'Bisa baca file & nambah data',
      scrollRef: (el) => { this._sc = el; },
      close: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); },
      draft: s.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.submit(s.draft); } },
      send: () => this.submit(s.draft),
      chip1: () => this.submit('tambahin rutinitas minum air 8 gelas jam 9 pagi'),
      chip2: () => this.submit('Aku boros di mana?'),
      sendStyle: 'width: 40px; height: 40px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; ' + (can ? 'background: #027A48; color: #FFFFFF' : 'background: #DCE3DF; color: #6B7873')
    };
  }
}
</script>
</body>
</html>
