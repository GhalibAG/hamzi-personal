# Keep-alive CADANGAN (TECH-SPEC §6.7). Penjadwal utama tetap Cloudflare Worker (tiap menit).
# [verifikasi] GitHub dapat menonaktifkan workflow terjadwal pada repo yang lama tidak aktif (± 60 hari).
# Secrets repo: SUPABASE_URL, SUPABASE_ANON_KEY (nilai publik, tetap simpan sebagai secret).
name: Keepalive

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (rpc_ping)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Secret SUPABASE_URL / SUPABASE_ANON_KEY belum diatur"; exit 0
          fi
          # Kunci publishable baru (sb_publishable_…) bukan JWT → cukup header apikey. [verifikasi]
          AUTH=()
          case "$SUPABASE_ANON_KEY" in
            sb_publishable_*) ;;
            *) AUTH=(-H "Authorization: Bearer $SUPABASE_ANON_KEY") ;;
          esac
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/rpc_ping" \
            -H "apikey: $SUPABASE_ANON_KEY" "${AUTH[@]}" \
            -H "Content-Type: application/json" -d '{}'
          echo
